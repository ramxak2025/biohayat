services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: biohayat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-biohayat}
      POSTGRES_DB: biohayat
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biohayat"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://biohayat:${POSTGRES_PASSWORD:-biohayat}@db:5432/biohayat?schema=public"
      AUTH_SECRET: ${AUTH_SECRET:?Задайте AUTH_SECRET в .env}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@biohayat.ru}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
      ADMIN_NAME: ${ADMIN_NAME:-Администратор}
    ports:
      # Прямой доступ по http://IP:3000 (без домена). С Caddy можно убрать.
      - "3000:3000"
    volumes:
      # сохраняем загруженные изображения между перезапусками
      - uploads:/app/public/uploads

  # HTTPS-прокси с автоматическим SSL (Let's Encrypt).
  # Запускается только с доменом: docker compose --profile proxy up -d
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["proxy"]
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:?Задайте DOMAIN в .env для HTTPS}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  uploads:
  caddy-data:
  caddy-config:
